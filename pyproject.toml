[tool.ruff]
line-length = 100
# Minimum Python verified for the pinned wheels in requirements.txt is 3.12
# (todo.md T1-003); TECH_RULES.md states "3.11+ (verify team version)".
target-version = "py312"
extend-exclude = ["android-collector", "data", "notebooks", "models", ".venv", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Test modules deliberately use long literal data and private helpers.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["ml", "agents"]
branch = true

[tool.coverage.report]
# Proposed target from PRD (Success Metrics) and todo.md T1-004. Raise from 0
# to this value once the Phase 7 unit/integration test tasks land.
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
