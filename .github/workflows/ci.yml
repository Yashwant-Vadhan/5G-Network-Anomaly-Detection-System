name: CI

# todo.md T1-005. Lint + test on every pull request and on pushes to main.
# No secrets are used or required by this workflow.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # The pinned wheels in requirements.txt resolve on Python 3.12-3.14
        # (numpy 2.5.3 has no cp311 wheel). 3.13 is the CI reference version.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Test (pytest with coverage)
        run: |
          set +e
          python -m pytest --cov=ml --cov=agents --cov-report=term-missing --cov-fail-under=80
          status=$?
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

