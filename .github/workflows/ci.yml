name: CI

# todo.md T1-005. Lint + test on every pull request and on pushes to main.
# No secrets are used or required by this workflow.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        # The pinned wheels in requirements.txt resolve on Python 3.12-3.14
        # (numpy 2.5.3 has no cp311 wheel). 3.13 is the CI reference version.
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Generate pipeline artifacts from sample data
        run: python -m pipelines.run_pipeline --input data/sample --output data/processed

      - name: Test (pytest with coverage)
        run: >
          python -m pytest --cov=ml --cov=agents --cov=streaming
          --cov-report=term-missing --cov-fail-under=80 -m "not soak"

  frontend:
    name: frontend lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  container:
    name: build container image
    runs-on: ubuntu-latest
    needs: [quality, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: 5gnads-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max


