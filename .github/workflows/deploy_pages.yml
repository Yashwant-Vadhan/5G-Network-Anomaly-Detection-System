name: CI/CD - Deploy Static Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static SPA with public bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build public demo bundle (G27 anonymised)
        run: python scripts/build_demo_bundle.py --source sample --public

      - name: Verify bundle privacy (G27 - zero raw cell IDs)
        run: python -m pytest tests/test_demo_bundle_privacy.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit & integration tests (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build frontend static distribution
        working-directory: frontend
        run: npm run build

      - name: Verify dist bundle privacy
        run: |
          python -c "
          import json
          with open('frontend/dist/demo-bundle.json') as f:
              b = json.load(f)
          assert b.get('privacy', {}).get('cell_ids') == 'hashed'
          print('Verified: frontend/dist/demo-bundle.json has hashed cell IDs')
          "

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
